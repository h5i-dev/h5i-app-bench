# Read by `h5i app extract` and `h5i app check`.

[extract]
crate = "kernel"
start-from = ["transition", "shows_body", "authenticate_login", "token_actor", "user_conflicts"]

[check]
theorems = [
  "conduit_kernel.user_conflicts_exact",
  "conduit_kernel.token_rejects_invalid",
  "conduit_kernel.token_missing_guest",
  "conduit_kernel.token_actor_safe",
  "conduit_kernel.token_claims_exact",
  "conduit_kernel.login_success_iff",
  "conduit_kernel.guest_cannot_mutate",
  "conduit_kernel.only_author_updates_article",
  "conduit_kernel.only_author_deletes_article",
  "conduit_kernel.only_author_deletes_comment",
  "conduit_kernel.favorite_consistent",
  "conduit_kernel.unfavorite_consistent",
  "conduit_kernel.follow_consistent",
  "conduit_kernel.unfollow_consistent",
  "conduit_kernel.register_rejects_blanks",
  "conduit_kernel.register_rejects_short_password",
  "conduit_kernel.login_rejects_blank_password",
  "conduit_kernel.update_user_rejects_nulls_and_short_password",
  "conduit_kernel.article_rejects_blank_and_null_tags",
  "conduit_kernel.delete_unknown_before_forbidden",
  "conduit_kernel.comment_delete_checks_article_first",
  "conduit_kernel.page_rejects_bad_limit",
  "conduit_kernel.shows_body_list",
  "conduit_kernel.shows_body_detail",
]
