[package]
name = "conduit-server"
edition = "2024"
version = "0.1.0"
publish = false

[dependencies]
axum = "0.7"
bcrypt = "0.17"
conduit-kernel = { path = "../kernel" }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
