[package]
name = "bootstrapacademy-difftest"
description = "Differential test: the Bootstrap Academy kernel against the backend's own code at fbe5e60"
edition = "2024"
version = "0.1.0"
publish = false

[dependencies]
bootstrapacademy-kernel = { path = "../kernel" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.test]
opt-level = 3
debug-assertions = true
overflow-checks = true

[workspace]
