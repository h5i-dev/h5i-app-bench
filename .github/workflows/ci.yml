name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with examples/docs/proofs/lakefile.lean.
  AENEAS_REV: b86120db3183b0107eb5f2637b11c424cd06ef1c

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: i5h
          POSTGRES_PASSWORD: i5h
          POSTGRES_DB: i5h
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U i5h"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      I5H_TEST_DATABASE_URL: postgres://i5h:i5h@127.0.0.1:5432/i5h
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --locked
      - run: scripts/ci-rust-tests.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # A8: only i5h-pg may depend on database drivers.
      - run: cargo deny check bans

  lean:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/docs/proofs
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: examples/docs/proofs/.lake
          key: lake-${{ hashFiles('examples/docs/proofs/lake-manifest.json', 'examples/docs/proofs/lean-toolchain', 'examples/docs/proofs/lakefile.lean') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ hashFiles('examples/docs/proofs/lake-manifest.json', 'examples/docs/proofs/lean-toolchain', 'examples/docs/proofs/lakefile.lean') }}-
      - run: lake exe cache get
      - run: lake build
      # No sorry, no native_decide, only standard axioms.
      - run: ../../../scripts/ci-lean-gate.sh
      # These projects share the docs project's pinned Aeneas packages.
      - name: Build the other extracted-crate proofs
        working-directory: .
        run: |
          for d in crates/i5h-sql/proofs crates/i5h-token/proofs crates/i5h-json/proofs examples/kellnr/proofs examples/atuin/proofs; do
            mkdir -p "$d/.lake"
            ln -sfn "$GITHUB_WORKSPACE/examples/docs/proofs/.lake/packages" "$d/.lake/packages"
            (cd "$d" && lake build)
            if grep -n -w -e sorry -e native_decide "$d"/*.lean; then exit 1; fi
            if grep -n "^axiom" "$d"/*.lean; then exit 1; fi
          done
      # Engine protocol model (plain Lean, no dependencies).
      - name: Build engine protocol model
        working-directory: lean
        run: lake build

  # A9: the committed Lean must be exactly what Aeneas extracts from the kernel.
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          # Aeneas CI pushes its builds here.
          extra_nix_config: |
            extra-substituters = https://hacl.cachix.org
            extra-trusted-public-keys = hacl.cachix.org-1:FzsZ2xsByOwKwIWNPII7yMOelJNDZ12mDAj3d1eGX0c=
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Build Charon and Aeneas at the pinned commit
        run: |
          nix build "github:AeneasVerif/aeneas/$AENEAS_REV" -o "$RUNNER_TEMP/aeneas" -L
          nix build "github:AeneasVerif/aeneas/$AENEAS_REV#charon" -o "$RUNNER_TEMP/charon" -L
          echo "$RUNNER_TEMP/aeneas/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/charon/bin" >> "$GITHUB_PATH"
      - run: scripts/extract.sh
      - run: scripts/extract-sql.sh
      - run: scripts/extract-token.sh
      - run: scripts/extract-json.sh
      - run: scripts/extract-kellnr.sh
      - run: scripts/extract-atuin.sh
      - run: |
          git diff --exit-code -- \
            examples/docs/proofs/DocsKernel.lean \
            crates/i5h-sql/proofs/I5hSql.lean \
            crates/i5h-token/proofs/I5hToken.lean \
            crates/i5h-json/proofs/I5hJson.lean \
            examples/kellnr/proofs/KellnrKernel.lean \
            examples/atuin/proofs/AtuinKernel.lean
