[package]
name = "docs-server"
description = "Shell of the i5h example app: tables, JSON codec, HTTP server"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
i5h.workspace = true
i5h-pg.workspace = true
i5h-http.workspace = true
i5h-json.workspace = true
docs-kernel.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Tests inject faults with raw SQL; app code cannot (deny.toml).
tokio-postgres.workspace = true
i5h-pg = { workspace = true, features = ["testing"] }
proptest.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
