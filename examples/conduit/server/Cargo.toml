[package]
name = "conduit-server"
description = "The RealWorld Conduit API on the verified conduit kernel, with a PostgreSQL store"
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
publish = false

[dependencies]
i5h = { path = "../../../crates/i5h" }
i5h-pg = { path = "../../../crates/i5h-pg" }
i5h-http = { path = "../../../crates/i5h-http" }
i5h-json = { path = "../../../crates/i5h-json" }
conduit-kernel = { path = "../kernel" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Already in the tree through i5h-http; used for password hashes.
libcrux-hmac = "0.0.8"
