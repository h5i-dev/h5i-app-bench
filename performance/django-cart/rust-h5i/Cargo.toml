[package]
name = "cart-server"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
h5i-app-core = { git = "https://github.com/h5i-dev/h5i", rev = "0d52512471d09f13db79230a05ea9387ef18f637" }
h5i-app-pg = { git = "https://github.com/h5i-dev/h5i", rev = "0d52512471d09f13db79230a05ea9387ef18f637" }
h5i-app-sql = { git = "https://github.com/h5i-dev/h5i", rev = "0d52512471d09f13db79230a05ea9387ef18f637" }
django-cart-pricing = { path = "../rust-h5i-gpu" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
