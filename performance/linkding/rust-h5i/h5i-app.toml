# Read by `h5i app` (extract, check, prove, mutate, doctor).

[extract]
start-from = ["transition", "read_only", "reads", "list_count"]
schema = true
include = ["h5i_app_sql"]

[check]
# Must exist and use only the standard axioms (every theorem in a hand-written
# module is gated as well).
theorems = [
    "linkding_kernel.Storage.stored",
    "linkding_kernel.ReadOnly.read_only_sound",
    "linkding_kernel.Theorems.guest_writes_nothing",
    "linkding_kernel.Theorems.unknown_token_refused",
    "linkding_kernel.Owner.writes_own",
    "linkding_kernel.Owner.get_bookmark_owned",
    "linkding_kernel.Owner.get_tag_owned",
    "linkding_kernel.Owner.get_bundle_owned",
    "linkding_kernel.Plan.reads_abs",
    "linkding_kernel.Plan.count_abs",
    "linkding_kernel.Frame.frame",
    "linkding_kernel.Frame.load_for_sound",
    "linkding_kernel.Frame.count_tags",
    "linkding_kernel.Frame.count_paged",
]
