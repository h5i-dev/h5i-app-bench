[package]
name = "linkding-server"
description = "The linkding REST API on the verified linkding kernel, run by the h5i-app engine on PostgreSQL"
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
publish = false

[[bin]]
name = "linkding-server"
path = "src/main.rs"

[dependencies]
# h5i-app from git, a fixed h5i revision (the Lean library in
# proofs/lakefile.lean and lake-manifest.json is pinned to the same commit).
h5i-app-core = { git = "https://github.com/h5i-dev/h5i", rev = "8e764ab849f71e771bc8d026491a3c104f8cb6a5" }
h5i-app-pg = { git = "https://github.com/h5i-dev/h5i", rev = "8e764ab849f71e771bc8d026491a3c104f8cb6a5" }
linkding-kernel = { path = "../kernel" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Request validation, URL normalization and dates, as rust-h5i-optimized.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
url = "2"
# Sends a listing's count with its plan on one connection.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
