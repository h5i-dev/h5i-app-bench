[package]
name = "linkding-gpu-server"
description = "Linkding REST API shell. Authorization, pagination, and search parsing live in linkding-kernel."
edition = "2021"
version = "0.1.0"
publish = false

[dependencies]
axum = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
linkding-kernel = { path = "../../rust-h5i-optimized/kernel" }
linkding-gpu = { path = ".." }
linkding-gpu-nvvm = { path = "../backend-nvvm", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
url = "2"

[features]
# CPU-only by default (portable, builds in CI). `gpu` pulls in the Rust-CUDA
# resident launch; host-only, needs the Rust-CUDA nightly + libNVVM + a device.
gpu = ["dep:linkding-gpu-nvvm"]
