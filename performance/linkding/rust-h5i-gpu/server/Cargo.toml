[package]
name = "linkding-gpu-server"
description = "The linkding REST API on the verified linkding kernel, run by the h5i-app engine on PostgreSQL"
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"
publish = false

[features]
default = []
gpu = ["dep:linkding-gpu-nvvm"]

[[bin]]
name = "linkding-gpu-server"
path = "src/main.rs"

[dependencies]
# h5i-app from git, h5i main (pinned in Cargo.lock; the Lean library in
# proofs/lakefile.lean and lake-manifest.json is pinned to the same commit).
h5i-app-core = { git = "https://github.com/h5i-dev/h5i", branch = "main" }
h5i-app-pg = { git = "https://github.com/h5i-dev/h5i", branch = "main" }
linkding-kernel = { path = "../../rust-h5i/kernel" }
# The search index packs bookmarks with the GPU crate's layout; the Rust-CUDA
# backend is behind `gpu` so the server still builds on stable without a GPU
# (the search falls back to the CPU scan).
linkding-gpu = { path = ".." }
linkding-gpu-nvvm = { path = "../backend-nvvm", optional = true }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Request validation, URL normalization and dates, as rust-h5i-optimized.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
url = "2"
# Sends a listing's count with its plan on one connection.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
