# Read by `h5i app` (extract, check, prove, mutate, doctor).

[extract]
start-from = ["transition", "transition_upstream", "read_only", "reads", "article_count"]
schema = true
include = ["h5i_app_sql"]

[check]
# Must exist and use only the standard axioms (every theorem in a hand-written
# module is gated as well).
theorems = [
    "conduit_kernel.Storage.db_inv",
    "conduit_kernel.ReadOnly.read_only_sound",
    "conduit_kernel.Plan.reads_abs",
    "conduit_kernel.Schema.decode_load",
    "conduit_kernel.Frame.frame",
    "conduit_kernel.Frame.load_for_sound_inv",
    "conduit_kernel.Plan.count_abs",
    "conduit_kernel.Frame.count_list",
    "conduit_kernel.Frame.count_list_unknown",
    "conduit_kernel.Frame.count_feed",
    "conduit_kernel.Replies.update_reply",
]

[[mutant]]
name = "edit_others_article"
old = "if a.author != me.id {\n        return Err(Error::Forbidden);\n    }\n    if slug_taken"
new = "if false {\n        return Err(Error::Forbidden);\n    }\n    if slug_taken"
