# Each task: one property of one ported repository.
# src: <checkout>:<port dir>, with kernel/ and proofs/ inside.
# module/theorem: where the reference proof lives, for validation and LOC.
# given: hand-written Lean files the model sees (the spec); everything else
# under proofs/ except generated/ is hidden.

[[task]]
id = "atuin-isolation"
repo = "atuinsh/atuin"
src = "h5i:examples/app/atuin"
ns = "atuin_kernel"
given = ["Spec.lean"]
module = "Theorems"
theorem = "atuin_kernel.Theorems.isolation"
reference = true
property = "Every write of a successful command touches only the caller's account, or the account being created."

[[task]]
id = "atuin-reply-confined"
repo = "atuinsh/atuin"
src = "h5i:examples/app/atuin"
ns = "atuin_kernel"
given = ["Spec.lean"]
module = "Theorems"
theorem = "atuin_kernel.Theorems.reply_confined"
reference = true
property = "Replies contain only the caller's own records."

[[task]]
id = "kellnr-read-only"
repo = "kellnr/kellnr"
src = "h5i:examples/app/kellnr"
ns = "kellnr_kernel"
given = ["Spec.lean"]
module = "Theorems"
theorem = "kellnr_kernel.Theorems.read_only_commits_nothing"
reference = true
property = "A read-only user who is not an admin commits no write, whichever way they logged in."

