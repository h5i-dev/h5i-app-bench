# Read by `h5i app`: extract, check, prove, mutate, doctor.

[extract]
crate = "kernel"
# Charon starts here and extracts what it reaches.
start-from = ["decode_filename", "percent_decode", "valid_name", "classify", "is_mutating", "is_dot_name"]

[check]
# Must exist and use only Lean's standard axioms. Every theorem in a
# hand-written module under proofs/ is gated anyway; naming the main ones
# here catches a rename.
theorems = [
  "pico_bit_kernel.Properties.valid_name_no_traversal",
  "pico_bit_kernel.Properties.decode_filename_confined",
  "pico_bit_kernel.Properties.decode_filename_total",
  "pico_bit_kernel.Properties.percent_decode_total",
  "pico_bit_kernel.Properties.valid_name_total",
  "pico_bit_kernel.Properties.classify_total",
  "pico_bit_kernel.Properties.mutating_needs_unsafe_method",
]

# Bugs the proofs must reject (`h5i app mutate`). Each `old` must occur
# exactly once in kernel/src/lib.rs (or in `file`).
[[mutant]]
name = "drop_slash_check"
old = "    b == SLASH || b == BACKSLASH || b == NUL"
new = "    b == BACKSLASH || b == NUL"

[[mutant]]
name = "drop_dotdot_check"
old = "        return buf[0] == DOT && buf[1] == DOT;"
new = "        return false;"

[[mutant]]
name = "validate_before_decode"
old = "            if valid_name_prefix(out, n) {"
new = "            if valid_name_prefix(raw, raw.len()) {"
