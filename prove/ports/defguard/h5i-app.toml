file = "kernel/src/ipalloc.rs"
old = "if assignable(n, x, used, reserved) {"
new = "if assignable(n, x, used, reserved) && x != network(n) + 1 {"

[[mutant]]
name = "fix_recheck_kept_address"
file = "kernel/src/ipalloc.rs"
old = "            Some(ip) => Some(ip),"
new = "            Some(ip) => if assignable(n, ip.bits, used, reserved) { Some(ip) } else { first_free(n, used, reserved) },"

[[mutant]]
name = "merge_always"
file = "kernel/src/ranges.rs"
old = "if next_up >= s {"
new = "if true {"

[[mutant]]
