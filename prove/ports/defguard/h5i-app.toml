# Standard h5i-app project: defguard (DefGuard/defguard @ 12508b4).
[extract]
crate = "kernel"
start-from = ["ipalloc::assign_next_network_ip", "lockout::authenticate", "auth::admin_role", "auth::user_for_admin_or_self", "auth::device_for_admin_or_self", "token::start_session", "token::validate_session", "ranges::merge_ranges"]

[check]
theorems = [
  "defguard_kernel.Properties.locked_name_blocked",
  "defguard_kernel.Properties.verified_needs_password",
  "defguard_kernel.Properties.failure_recorded",
  "defguard_kernel.Properties.fifth_failure_locks",
  "defguard_kernel.Properties.email_login_never_locked",
  "defguard_kernel.Properties.session_info_sound",
  "defguard_kernel.Properties.expired_session_rejected",
  "defguard_kernel.Properties.admin_role_sound",
  "defguard_kernel.Properties.other_user_needs_admin",
  "defguard_kernel.Properties.other_device_needs_admin",
  "defguard_kernel.Properties.expired_token_never_starts",
  "defguard_kernel.Properties.token_single_session",
  "defguard_kernel.Properties.enrollment_session_sound",
  "defguard_kernel.Properties.session_outlives_token",
  "defguard_kernel.Properties.fresh_addresses_valid",
  "defguard_kernel.Properties.full_only_when_full",
  "defguard_kernel.Properties.kept_address_unchecked",
  "defguard_kernel.Properties.keeps_gateway_address",
  "defguard_kernel.Properties.merge_ranges_exact",
  "defguard_kernel.Properties.merge_ranges_overlap",
  "defguard_kernel.Verified.verify_username_ok",
  "defguard_kernel.Verified.log_failed_attempt_ok",
  "defguard_kernel.Verified.find_account_ok",
  "defguard_kernel.Verified.authenticate_cases",
  "defguard_kernel.Verified.extract_session_ok",
  "defguard_kernel.Verified.start_session_ok",
  "defguard_kernel.Verified.is_session_valid_ok",
]

# Bugs the proofs must reject (`h5i app mutate`); `fix_*` mutants fix a
# finding and must break the theorem that records it.
[[mutant]]
name = "lockout_threshold_six"
file = "kernel/src/lockout.rs"
old = "f.attempt_count >= COUNT && now - f.last_attempt <= TIMEOUT_NS"
new = "f.attempt_count > COUNT && now - f.last_attempt <= TIMEOUT_NS"

[[mutant]]
name = "lockout_not_enforced"
file = "kernel/src/lockout.rs"
old = "    if blocked {"
new = "    if false {"

[[mutant]]
name = "failure_not_logged"
file = "kernel/src/lockout.rs"
old = "(log_failed_attempt(&m1, &us[i].username, now), LoginOutcome::WrongPassword)"
new = "(m1, LoginOutcome::WrongPassword)"

[[mutant]]
name = "password_ignored"
file = "kernel/src/lockout.rs"
old = "if i < password_ok.len() && password_ok[i] {"
new = "if i < password_ok.len() {"

[[mutant]]
name = "fix_log_failure_under_typed_name"
file = "kernel/src/lockout.rs"
old = "(log_failed_attempt(&m1, &us[i].username, now), LoginOutcome::WrongPassword)"
new = "(log_failed_attempt(&m1, input, now), LoginOutcome::WrongPassword)"

[[mutant]]
name = "mfa_gate_dropped"
file = "kernel/src/auth.rs"
old = "if u.mfa_enabled && s.state != SessionState::MultiFactorVerified && s.state != SessionState::ApiTokenVerified {"
new = "if false {"

[[mutant]]
