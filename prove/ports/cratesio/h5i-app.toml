# Standard h5i-app project. Keep every selected theorem in the final gate.
[extract]
crate = "kernel"
start-from = ["validation::validate_crate_name", "validation::validate_dependency_name", "scopes::is_valid_pattern", "scopes::scope_matches", "auth::parse_auth_header", "auth::authenticate", "auth::check", "rights::rights", "publish::publish_auth", "publish::parse_access_token", "trustpub::exchange_github", "trustpub::workflow_filename", "rate_limit::check_rate_limit"]

[check]
theorems = [
  "cratesio_kernel.Properties.cross_origin_never_authenticates",
  "cratesio_kernel.Properties.token_authentication_is_live",
  "cratesio_kernel.Properties.revoked_or_expired_token_rejected",
  "cratesio_kernel.Properties.session_needs_current_epoch",
  "cratesio_kernel.Properties.locked_account_never_authenticates",
  "cratesio_kernel.Properties.cookie_only_rejects_tokens",
  "cratesio_kernel.Properties.token_needs_endpoint_scope",
  "cratesio_kernel.Properties.token_confined_to_crate_scopes",
  "cratesio_kernel.Properties.crate_scoped_token_needs_crate_or_opt_in",
  "cratesio_kernel.Properties.full_rights_only_for_listed_user",
  "cratesio_kernel.Properties.team_rights_need_active_membership",
  "cratesio_kernel.Properties.rights_decrypt_failure_denies_direct_owner",
  "cratesio_kernel.Properties.trustpub_publish_bound_to_crate",
  "cratesio_kernel.Properties.trustpub_cannot_create_crates",
  "cratesio_kernel.Properties.trustpub_only_rejects_users",
  "cratesio_kernel.Properties.publish_existing_needs_ownership",
  "cratesio_kernel.Properties.publish_token_scoped",
  "cratesio_kernel.Properties.exchange_only_matching_configs",
  "cratesio_kernel.Properties.exchange_environment_enforced",
  "cratesio_kernel.Properties.exchange_jti_single_use",
  "cratesio_kernel.Properties.exchange_replay_rejected",
  "cratesio_kernel.Properties.exchange_rejects_forbidden_events",
]
