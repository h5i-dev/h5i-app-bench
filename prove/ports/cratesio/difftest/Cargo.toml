[package]
name = "cratesio-difftest"
description = "Differential test: the crates.io kernel against crates.io's own code at e0fc83a"
edition = "2024"
version = "0.1.0"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
cratesio-kernel = { path = "../kernel" }
# The pinned upstream crate itself (`../upstream-src` links the checkout).
crates_io_validation = { path = "../upstream-src/crates/crates_io_validation" }
# Versions as in upstream's Cargo.toml, for the copied items.
regex = "=1.13.1"
rand = "=0.10.3"
sha2 = "=0.11.1"
secrecy = "=0.10.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
chrono = "0.4"
http = "1"
futures = { version = "0.3", default-features = false, features = ["executor"] }

[workspace]

[profile.release]
overflow-checks = true
debug-assertions = true
