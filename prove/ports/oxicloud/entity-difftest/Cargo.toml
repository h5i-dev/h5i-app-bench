[package]
name = "oxicloud-entity-difftest"
version = "0.1.0"
edition = "2024"
publish = false
[dependencies]
oxicloud-kernel = { path = "../kernel" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = "0.4"
tracing = "0.1"
utoipa = "5"
thiserror = "2"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
http = "1"
smol_str = "0.3"
[workspace]
[profile.release]
overflow-checks = true
