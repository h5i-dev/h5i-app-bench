[package]
name = "oxicloud-difftest"
description = "Differential test: the OxiCloud kernel against OxiCloud's own engine and services at 8c0dd33, on PostgreSQL"
edition = "2024"
version = "0.1.0"
publish = false

[dependencies]
oxicloud-kernel = { path = "../kernel" }
# The upstream crate itself, from the pinned checkout (scripts/link-upstream.sh).
oxicloud = { path = "../upstream-src" }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "json", "migrate"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
serde_json = "1"

[workspace]

[profile.release]
overflow-checks = true
