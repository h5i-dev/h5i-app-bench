# Standard h5i-app project. Keep every selected theorem in the final gate.
[extract]
crate = "kernel"
# Extract every public function in these modules; derived formatting/equality
# implementations are outside the verification roots and need no opaque stubs.
start-from = [
  "access",
  "softlock::after",
  "softlock::same_time",
  "softlock::plus_seconds",
  "softlock::failure_next_state",
  "softlock::new",
  "softlock::apply_time_step",
  "softlock::is_valid",
  "softlock::record_failure",
  "schema_tags::partial_accepts",
  "schema_tags::value_accepts",
  "schema_tags::ava_accepts",
  "credential_commit::can_commit",
  "account_policy::initial",
  "account_policy::option_max",
  "account_policy::combine",
  "account_policy::finalize",
  "account_policy::fold_from",
]

[check]
theorems = [
  "kanidm_kernel.Properties.protected_deny_overrides_modify",
  "kanidm_kernel.Properties.protected_deny_overrides_create",
  "kanidm_kernel.Properties.search_attrs_granted",
  "kanidm_kernel.Properties.anonymous_reads_by_profile_only",
  "kanidm_kernel.Properties.synchronise_sees_nothing",
  "kanidm_kernel.Properties.readonly_cannot_modify",
  "kanidm_kernel.Properties.delete_needs_profile",
  "kanidm_kernel.Properties.create_needs_profile",
  "kanidm_kernel.Properties.modify_needs_profile",
  "kanidm_kernel.Properties.delete_protected",
  "kanidm_kernel.Properties.create_protected",
  "kanidm_kernel.Properties.tombstone_locked",
  "kanidm_kernel.Properties.protected_class_never_added",
  "kanidm_kernel.Properties.sync_object_constrained",
  "kanidm_kernel.Properties.account_request_creates_signups",
  "kanidm_kernel.Properties.match_eq_spec",
  "kanidm_kernel.Properties.str_contains_spec",
  "kanidm_kernel.Properties.effective_permission_check_total",
  "kanidm_kernel.Properties.soft_lock_apply_time_step_spec",
  "kanidm_kernel.Properties.soft_lock_is_valid_spec",
  "kanidm_kernel.Properties.soft_lock_new_spec",
  "kanidm_kernel.Properties.soft_lock_password_lockout",
  "kanidm_kernel.Properties.soft_lock_totp_lockout",
  "kanidm_kernel.Properties.soft_lock_webauthn_failure",
