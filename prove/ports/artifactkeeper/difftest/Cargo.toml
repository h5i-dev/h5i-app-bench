[package]
name = "artifactkeeper-difftest"
description = "Differential test: the artifact-keeper kernel against artifact-keeper's own code at 7c42891"
edition = "2021"
version = "0.1.0"
publish = false

[dependencies]
artifactkeeper-kernel = { path = "../kernel" }
sqlx = { path = "sqlx-mock" }
axum = { version = "0.7", default-features = false, features = ["tokio", "json", "original-uri"] }
base64 = "0.22"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
utoipa = { version = "5", features = ["uuid"] }
uuid = { version = "1", features = ["serde"] }

[workspace]
