# Standard h5i-app project. Keep every selected theorem in the final gate.
[extract]
crate = "kernel"
start-from = ["perms", "policy", "auth"]

[check]
theorems = [
  "synctv_kernel.Properties.has_correct",
  "synctv_kernel.Properties.effective_permissions_correct",
  "synctv_kernel.Properties.role_default_correct",
  "synctv_kernel.Properties.calculator_correct",
  "synctv_kernel.Properties.guest_confined",
  "synctv_kernel.Properties.guest_effective_confined",
  "synctv_kernel.Properties.member_overrides_confined",
  "synctv_kernel.Properties.member_default_confined",
  "synctv_kernel.Properties.admin_ignores_plain_columns",
  "synctv_kernel.Properties.non_admin_ignores_admin_columns",
  "synctv_kernel.Properties.removed_never_held",
  "synctv_kernel.Properties.creator_holds_all",
  "synctv_kernel.Properties.calculator_precheck_redundant",
  "synctv_kernel.Properties.default_admin_spec",
  "synctv_kernel.Properties.default_guest_empty",
  "synctv_kernel.Properties.default_member_spec",
  "synctv_kernel.Properties.admin_delete_room_needs_explicit_grant",
  "synctv_kernel.Properties.member_delete_room_only_from_server_default",
  "synctv_kernel.Properties.creator_role_never_assignable",
  "synctv_kernel.Properties.only_creator_admits_admins",
  "synctv_kernel.Properties.role_change_only_by_creator",
  "synctv_kernel.Properties.overrides_stay_in_role_space",
  "synctv_kernel.Properties.override_channel_matches_role",
  "synctv_kernel.Properties.update_needs_existing_member",
  "synctv_kernel.Properties.kick_cooldown_bounded",
  "synctv_kernel.Properties.can_manage_eq",
  "synctv_kernel.Properties.manage_needs_higher_role",
  "synctv_kernel.Properties.manager_is_admin_or_above",
  "synctv_kernel.Properties.banned_cannot_login",
  "synctv_kernel.Properties.expiration_correct",
  "synctv_kernel.Properties.expired_token_rejected",
  "synctv_kernel.Properties.zero_leeway_strict",
  "synctv_kernel.Properties.token_type_enforced",
  "synctv_kernel.Properties.guest_revocation_effective",
  "synctv_kernel.Properties.guest_access_requires",
  "synctv_kernel.Properties.pipeline_accepts_only_valid",
  "synctv_kernel.Properties.bearer_token_after_scheme",
]

