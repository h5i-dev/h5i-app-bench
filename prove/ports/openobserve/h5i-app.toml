# Standard h5i-app project. Keep every selected theorem in the final gate.
[extract]
crate = "kernel"
start-from = ["delegation::validate_delegated", "delegation::in_assistant_scope", "delegation::in_slack_action_scope", "delegation::touch_due", "auth::org_from_path", "auth::extractor_org_id", "grpc::check_auth_inner", "grpc::check_internal_auth"]

[check]
theorems = [
  # S: security properties
  "openobserve_kernel.Properties.expired_token_never_accepted",
  "openobserve_kernel.Properties.forged_token_never_accepted",
  "openobserve_kernel.Properties.previous_key_only_when_configured",
  "openobserve_kernel.Properties.accepted_token_lifetime_bounded",
  "openobserve_kernel.Properties.delegated_identity_is_org_member",
  "openobserve_kernel.Properties.revoked_link_denies",
  "openobserve_kernel.Properties.delegated_subject_is_linked_user",
  "openobserve_kernel.Properties.slack_off_denies",
  "openobserve_kernel.Properties.blocked_external_denied",
  "openobserve_kernel.Properties.delegated_route_in_token_org",
  "openobserve_kernel.Properties.delegated_methods_limited",
  "openobserve_kernel.Properties.delegated_never_on_proxy",
  "openobserve_kernel.Properties.slack_action_only_alerts_and_oncall",
  "openobserve_kernel.Properties.delegated_org_is_rbac_org",
  # F: finding
  "openobserve_kernel.Properties.lifetime_check_overflows",
  # C: correspondence and foundations
  "openobserve_kernel.Properties.accepted_claims",
  "openobserve_kernel.Properties.accepted_route",
  "openobserve_kernel.Verified.check_route_spec",
  "openobserve_kernel.Verified.in_scope_spec",
  "openobserve_kernel.Verified.segments_match_spec",
  "openobserve_kernel.Verified.checkRoute_ok",
  "openobserve_kernel.Verified.checkRoute_org_consistent",
  "openobserve_kernel.Verified.org_from_path_prefix_spec",
  "openobserve_kernel.Verified.extractor_org_id_spec",
  "openobserve_kernel.Verified.validate_delegated_ok",
  "openobserve_kernel.Verified.verify_ok",
  "openobserve_kernel.Verified.verify_spec",
  "openobserve_kernel.Verified.check_claims_spec",
  "openobserve_kernel.Verified.check_claims_ok",
  "openobserve_kernel.Verified.constant_time_eq_spec",
  "openobserve_kernel.Verified.load_link_facts_ok",
  "openobserve_kernel.Verified.admit_ok",
  "openobserve_kernel.Verified.split_slash_spec",
  "openobserve_kernel.Verified.path_org_spec",
  "openobserve_kernel.Verified.assistant_scope_spec",
  "openobserve_kernel.Verified.slack_action_scope_spec",
]

