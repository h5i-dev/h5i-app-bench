[package]
name = "openobserve-difftest"
description = "Differential test: the openobserve kernel against openobserve's own code at a774547"
edition = "2024"
version = "0.1.0"
publish = false
build = "build.rs"

[dependencies]
openobserve-kernel = { path = "../kernel" }
# What the copied upstream items use, at the versions openobserve's Cargo.lock resolves for them.
http = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = { version = "0.4", features = ["std"] }

[workspace]

[profile.release]
# openobserve's own release profiles leave overflow checks off; tests that
# depend on that are marked.
overflow-checks = false
