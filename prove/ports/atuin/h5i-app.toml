# Standard h5i-app project: atuin's sync server (atuinsh/atuin @ df152cd).
[extract]
crate = "kernel"
start-from = ["transition", "apply", "client_ip::resolve_client_ip"]

[check]
theorems = [
  "atuin_kernel.Properties.authorized",
  "atuin_kernel.Properties.unauthenticated_never_writes",
  "atuin_kernel.Properties.writes_owned",
  "atuin_kernel.Properties.delete_account_needs_password",
  "atuin_kernel.Properties.change_password_needs_password",
  "atuin_kernel.Properties.closed_registration",
  "atuin_kernel.Properties.stored_records_fit",
  "atuin_kernel.Properties.writes_authorized",
  "atuin_kernel.Properties.login_needs_password",
  "atuin_kernel.Properties.outcome_independent_of_other_users",
  "atuin_kernel.Properties.other_accounts_untouched",
  "atuin_kernel.Properties.account_deletion_purges",
  "atuin_kernel.Properties.records_append_only",
  "atuin_kernel.Properties.no_orphans",
  "atuin_kernel.Properties.new_account_starts_empty",
  "atuin_kernel.Properties.token_identifies_one_account",
  "atuin_kernel.Properties.password_change_keeps_sessions",
  "atuin_kernel.Properties.next_huge_count_is_unlimited",
  "atuin_kernel.Properties.next_start_wraps",
  "atuin_kernel.Verified.parse_authorization_spec",
  "atuin_kernel.Verified.authenticate_spec",
  "atuin_kernel.Verified.transition_writes",
  "atuin_kernel.Verified.apply_write_ok",
  "atuin_kernel.Verified.status_eq",
  "atuin_kernel.Verified.next_records_eq",
  "atuin_kernel.Verified.loop_eq_foldlM",
  "atuin_kernel.Verified.reachable_inv",
  "atuin_kernel.Verified.inv_step",
]

# Bugs the proofs must reject (`h5i app mutate`). Each `old` occurs exactly
# once in kernel/src/lib.rs.
[[mutant]]
name = "any_auth_scheme"
old = "if is_token_scheme(v, n) {"
new = "if true {"

[[mutant]]
name = "session_token_ignored"
old = "if bytes_eq(&ss[i].token, token) {\n            return Some(ss[i].clone());"
new = "if bytes_eq(token, token) {\n            return Some(ss[i].clone());"

[[mutant]]
name = "session_user_ignored"
old = "Some(sess) => find_user_by_id(&s.users, sess.user_id),"
new = "Some(_sess) => find_user_by_id(&s.users, 1),"

[[mutant]]
name = "registration_always_open"
old = "if !cfg.open_registration {"
new = "if false {"

[[mutant]]
name = "email_uniqueness_dropped"
old = "if eq_lower(&us[i].username, username) || eq_lower(&us[i].email, email) || bytes_eq(&us[i].password, hash) {"
new = "if eq_lower(&us[i].username, username) || bytes_eq(&us[i].password, hash) {"

[[mutant]]
name = "login_without_password"
old = "if verify(c, &u.password, password) {"
new = "if true {"

[[mutant]]
name = "delete_without_password"
old = "if !verify(c, &u.password, password) {"
new = "if false {"

[[mutant]]
name = "change_password_without_password"
old = "if !verify(c, &u.password, current) {"
new = "if false {"

[[mutant]]
name = "records_for_user_zero"
old = "ws.push(Write::InsertRecord(to_row(user_id, &rs[i])));"
new = "ws.push(Write::InsertRecord(to_row(0, &rs[i])));"

[[mutant]]
name = "delete_store_of_user_zero"
old = "ws.push(Write::DeleteStore(u.id));"
new = "ws.push(Write::DeleteStore(0));"

[[mutant]]
name = "size_limit_ignored"
old = "if !((rs[i].data.len() as u64) <= max || max == 0) {"
new = "if !((rs[i].data.len() as u64) <= max || max != 0) {"

[[mutant]]
name = "size_limit_strict"
old = "if !((rs[i].data.len() as u64) <= max || max == 0) {"
new = "if !((rs[i].data.len() as u64) < max || max == 0) {"

[[mutant]]
name = "next_ignores_user"
old = "r.user_id == user_id && bytes_eq(&r.tag, tag)"
new = "true && bytes_eq(&r.tag, tag)"

[[mutant]]
name = "status_ignores_user"
old = "if s.store[i].user_id == user_id {"
new = "if true {"

[[mutant]]
name = "delete_account_keeps_history"
old = "history: without_user_history(&s.history, *id),"
new = "history: s.history.clone(),"

[[mutant]]
name = "delete_account_wrong_sessions"
old = "sessions: without_user_sessions(&s.sessions, *id),"
new = "sessions: without_user_sessions(&s.sessions, 0),"

[[mutant]]
name = "insert_overwrites"
old = "store: if store_conflict(&s.store, r) { s.store.clone() } else { push_row(&s.store, r) },"
new = "store: if store_conflict(&s.store, r) { push_row(&without_user_store(&s.store, r.user_id), r) } else { push_row(&s.store, r) },"

[[mutant]]
name = "delete_account_keeps_records"
old = "history: without_user_history(&s.history, *id),\n            store: without_user_store(&s.store, *id),"
new = "history: without_user_history(&s.history, *id),\n            store: s.store.clone(),"

[[mutant]]
name = "user_counter_not_advanced"
old = "next_user_id: if u.id >= s.next_user_id && u.id < u64::MAX { u.id + 1 } else { s.next_user_id },"
new = "next_user_id: s.next_user_id,"

[[mutant]]
name = "duplicate_tokens_allowed"
old = "if user_conflict(&s.users, username, email, new_hash) || token_taken(&s.sessions, token) {"
new = "if user_conflict(&s.users, username, email, new_hash) {"

# Fixing a finding must break its theorem.
[[mutant]]
name = "fix_password_change_revokes_sessions"
old = "users: with_password(&s.users, *user_id, hash),\n            sessions: s.sessions.clone(),"
new = "users: with_password(&s.users, *user_id, hash),\n            sessions: without_user_sessions(&s.sessions, *user_id),"

[[mutant]]
name = "fix_count_limit"
old = "if count > 0x7fff_ffff_ffff_ffff {"
new = "if count == u64::MAX {"

[[mutant]]
name = "fix_unsigned_start"
old = "signed_key(r.idx) >= signed_key(start)"
new = "r.idx >= start"
