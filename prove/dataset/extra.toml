# Ports kept out of the benchmark (too little-used upstream); the grader
# still knows them.

[[task]]
id = "bootstrapacademy-unauthenticated-writes-nothing"
repo = "Bootstrap-Academy/backend"
src = "bench:ports/extra/bootstrapacademy"
ns = "bootstrapacademy_kernel"
given = ["Spec.lean"]
module = "Properties"
theorem = "bootstrapacademy_kernel.Properties.unauthenticated_writes_nothing"
property = "A request whose access token does not authenticate writes nothing, not even to the cache, and fails."

[[task]]
id = "bootstrapacademy-self-or-admin"
repo = "Bootstrap-Academy/backend"
src = "bench:ports/extra/bootstrapacademy"
ns = "bootstrapacademy_kernel"
given = ["Spec.lean"]
module = "Properties"
theorem = "bootstrapacademy_kernel.Properties.self_or_admin"
property = "A user-scoped command succeeds only for the account itself or for an administrator whose session passed the second factor."

[[task]]
id = "bootstrapacademy-admin-needs-mfa"
repo = "Bootstrap-Academy/backend"
src = "bench:ports/extra/bootstrapacademy"
ns = "bootstrapacademy_kernel"
given = ["Spec.lean"]
module = "Properties"
theorem = "bootstrapacademy_kernel.Properties.admin_needs_mfa"
property = "Impersonation and debiting coins need an administrator account and a session established with a verified second factor, as stored in the database."

[[task]]
