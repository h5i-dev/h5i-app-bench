src = "bench:ports/extra/bootstrapacademy"
ns = "bootstrapacademy_kernel"
given = ["Spec.lean"]
module = "Properties"
theorem = "bootstrapacademy_kernel.Properties.token_claims_ignored"
property = "The admin, email_verified and mfa claims of an access token do not change the outcome; authority is read from the account and the session."

