[workspace]
resolver = "3"
members = [
    "crates/i5h",
    "crates/i5h-pg",
    "crates/i5h-http",
    "crates/i5h-schema",
    "crates/i5h-sql",
    "crates/i5h-pgsql",
    "crates/i5h-token",
    "crates/i5h-json",
    "xtask",
]
# The examples are their own workspace, depending on these crates as a user would.
exclude = ["examples"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
i5h = { path = "crates/i5h" }
i5h-pg = { path = "crates/i5h-pg" }
i5h-http = { path = "crates/i5h-http" }
i5h-schema = { path = "crates/i5h-schema" }
i5h-token = { path = "crates/i5h-token" }
i5h-json = { path = "crates/i5h-json" }
i5h-sql = { path = "crates/i5h-sql" }
i5h-pgsql = { path = "crates/i5h-pgsql" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
serde_json = "1"
proptest = "1"
tracing = "0.1"
